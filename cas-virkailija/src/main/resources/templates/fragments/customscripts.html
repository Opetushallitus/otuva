<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <title>Footer Fragment</title>
    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag" />
</head>
<body th:fragment="customscripts">
    <script type="text/javascript" src="/cas/js/piwik.js"></script>
    <script type="text/javascript">
        function jqueryReady() {
            var text_fi = []
            var text_sv = []
            if (window.location.hostname === "virkailija.testiopintopolku.fi") {
                text_fi = ['KOSKI-palvelussa on koko päivän käyttökatko ti 27.10.2026 johtuen CSC:n VIRTA-opintotietopalvelun konesalisiirrosta. Korkeakoulusuoritustiedot eivät ole saatavilla ollenkaan ja Valpas-palvelussa esiintyy hitautta ja katkoja henkilöhauissa.']
                text_sv = ['KOSKI-tjänsten har ett driftavbrott under hela dagen tisdagen 27.10.2026 på grund av CSC:s flytt av datacentret för VIRTA-studieinformationssystemet. Uppgifter om högskolestudier är inte alls tillgängliga, och i Valpas-tjänsten kan personsökningar vara långsamma eller avbrytas.']
            }
            if (window.location.hostname === "virkailija.opintopolku.fi") {
                text_fi = ['KOSKI-palvelussa on koko päivän käyttökatko ti 27.10.2026 johtuen CSC:n VIRTA-opintotietopalvelun konesalisiirrosta. Korkeakoulusuoritustiedot eivät ole saatavilla ollenkaan ja Valpas-palvelussa esiintyy hitautta ja katkoja henkilöhauissa.']
                text_sv = ['KOSKI-tjänsten har ett driftavbrott under hela dagen tisdagen 27.10.2026 på grund av CSC:s flytt av datacentret för VIRTA-studieinformationssystemet. Uppgifter om högskolestudier är inte alls tillgängliga, och i Valpas-tjänsten kan personsökningar vara långsamma eller avbrytas.']
            }
            var language = $(document.documentElement).attr("lang") || "fi";

            var text = language === "sv" ? text_sv : text_fi;
            var textNodes = text.map(toDiv)
            var container = $("<div></div>", {
                class: "row justify-content-center ilmoitus",
            }).append(textNodes);
            container.prependTo("main");
        }

        function toDiv(s) {
            return $("<div></div>").text(s);
        }
        $(document).ready(jqueryReady);
    </script>
</body>
</html>
